name: VN Quant Daily Pipeline

on:
  schedule:
    # 09:00 UTC = 16:00 giờ Việt Nam (UTC+7) từ Thứ 2 đến Thứ 6
    - cron: '0 9 * * 1-5'
  workflow_dispatch: # Cho phép kích hoạt thủ công trên giao diện GitHub Actions

jobs:
  run-quant-signal:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 📊 Execute Market Analysis
        env:
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
        run: |
          python run_daily.py --analyze-only

      - name: 🚀 Send Telegram Notification
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python run_daily.py --notify-only
